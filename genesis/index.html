<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genesis — AI World Sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="canvas-container"></div>

        <!-- Top Bar -->
        <div id="top-bar">
            <div class="top-left">
                <span id="logo">GENESIS</span>
                <span id="entity-count" class="badge">0 entities</span>
                <span id="coord-display" class="badge coord">0, 0</span>
            </div>
            <div class="top-right">
                <button class="icon-btn" id="undo-btn" title="Undo (Ctrl+Z)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h10a5 5 0 0 1 0 10H9"/><polyline points="7 14 3 10 7 6"/></svg>
                </button>
                <button class="icon-btn" id="save-btn" title="Save / Load">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                </button>
                <button class="icon-btn" id="settings-btn" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </div>

        <!-- Command Bar -->
        <div id="command-bar">
            <div id="ai-toast" class="hidden"></div>
            <div class="command-input-wrap">
                <div id="command-loading" class="hidden">
                    <div class="spinner"></div>
                    <span>Thinking...</span>
                </div>
                <input id="command-input" type="text" placeholder="Describe what you want to create or change..." autocomplete="off" spellcheck="false">
                <button id="command-send" title="Send (Enter)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>

        <!-- Inspector Panel -->
        <div id="inspector" class="hidden">
            <div class="inspector-header">
                <h3>Inspector</h3>
                <button id="inspector-close" class="icon-btn small">✕</button>
            </div>
            <div id="inspector-content"></div>
            <div class="inspector-actions">
                <button id="inspector-delete" class="btn-danger">Delete Entity</button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <h2>Settings</h2>
                <div class="form-group">
                    <label for="api-key-input">OpenRouter API Key</label>
                    <input id="api-key-input" type="password" placeholder="sk-or-v1-...">
                    <small>Get a free key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a></small>
                </div>
                <div class="form-group">
                    <label for="model-select">AI Model</label>
                    <select id="model-select">
                        <option value="google/gemini-2.5-flash">Gemini 2.5 Flash (Fast / Free)</option>
                        <option value="google/gemini-2.5-pro">Gemini 2.5 Pro</option>
                        <option value="anthropic/claude-sonnet-4">Claude Sonnet 4</option>
                        <option value="openai/gpt-4o">GPT-4o</option>
                        <option value="meta-llama/llama-4-maverick">Llama 4 Maverick (Free)</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button id="settings-save" class="btn-primary">Save</button>
                    <button id="settings-cancel" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Save/Load Modal -->
        <div id="save-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-content">
                <h2>Save / Load World</h2>
                <div id="save-slots"></div>
                <div class="modal-actions">
                    <button id="save-new" class="btn-primary">Save Current World</button>
                    <button id="save-download" class="btn-secondary">Download as File</button>
                    <label id="save-upload" class="btn-secondary" for="file-upload">Upload File</label>
                    <button id="save-close" class="btn-secondary">Close</button>
                </div>
                <input type="file" id="file-upload" accept=".json,.genesis" class="hidden">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.3/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
    <script src="engine.js"></script>
</body>
</html>
