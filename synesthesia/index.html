<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synesthesia — Infinite Color Mixer</title>
    <meta name="description" content="An AI-powered infinite color mixing game. Merge colors to discover millions of unique shades.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- WebGL Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Parallax Orbs -->
    <div id="parallax-layer" class="parallax-layer" aria-hidden="true"></div>

    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Achievement Banner -->
    <div id="achievement" class="achievement hidden">
        <span class="ach-icon">✦</span>
        <div class="ach-text">
            <div id="ach-title" class="ach-title"></div>
            <div id="ach-desc" class="ach-desc"></div>
        </div>
    </div>

    <!-- ═══ API Key Modal ═══ -->
    <div id="api-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-prism"></div>
            <h2 class="modal-title">Synesthesia</h2>
            <p class="modal-sub">Mix colors. Discover the infinite spectrum.</p>
            <div class="input-group">
                <label for="api-key-input">OpenRouter API Key</label>
                <input type="password" id="api-key-input" placeholder="sk-or-v1-..." autocomplete="off">
            </div>
            <button id="api-submit-btn" class="btn-primary" onclick="submitApiKey()">Enter the Spectrum</button>
            <a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener" class="api-link">Get a free API key →</a>
        </div>
    </div>

    <!-- ═══ Main Game ═══ -->
    <div id="game" class="game-container hidden">

        <!-- Header -->
        <header class="game-header">
            <div class="logo">
                <span class="logo-prism">✦</span>
                <span class="logo-text">SYNESTHESIA</span>
            </div>
            <div class="header-stats">
                <div class="stat-pill">
                    <span id="color-count" class="stat-num">10</span>
                    <span class="stat-label">colors</span>
                </div>
                <div id="streak-pill" class="stat-pill streak-pill hidden">
                    <span class="streak-fire">🔥</span>
                    <span id="streak-count" class="stat-num">0</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openEvolutionTree()" title="Evolution Tree">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <circle cx="12" cy="4" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
                        <circle cx="4" cy="20" r="2"/><circle cx="10" cy="20" r="2"/><circle cx="16" cy="20" r="2"/><circle cx="22" cy="20" r="2"/>
                        <line x1="12" y1="6" x2="6" y2="10"/><line x1="12" y1="6" x2="18" y2="10"/>
                        <line x1="6" y1="14" x2="4" y2="18"/><line x1="6" y1="14" x2="10" y2="18"/>
                        <line x1="18" y1="14" x2="16" y2="18"/><line x1="18" y1="14" x2="22" y2="18"/>
                    </svg>
                </button>
                <button class="icon-btn" onclick="toggleSound()" id="sound-btn" title="Toggle Sound">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 010 7M19 5a9 9 0 010 14"/></svg>
                </button>
                <button class="icon-btn" onclick="openSettings()" title="Settings">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
        </header>

        <!-- Merge Station -->
        <section class="merge-station">
            <div class="merge-slots">
                <div id="slot-0" class="merge-slot empty" onclick="clearSlot(0)" ondragover="event.preventDefault()" ondrop="dropColor(event, 0)">
                    <div class="slot-ring"></div>
                    <div class="slot-swatch"></div>
                    <span class="slot-name">select</span>
                </div>

                <div class="merge-operator">
                    <div class="op-line"></div>
                    <span class="op-symbol">+</span>
                    <div class="op-line"></div>
                </div>

                <div id="slot-1" class="merge-slot empty" onclick="clearSlot(1)" ondragover="event.preventDefault()" ondrop="dropColor(event, 1)">
                    <div class="slot-ring"></div>
                    <div class="slot-swatch"></div>
                    <span class="slot-name">select</span>
                </div>
            </div>

            <div class="merge-actions">
                <div id="merge-btn-wrap" class="merge-btn-wrap hidden">
                    <button id="merge-btn" class="btn-merge" onclick="performMerge()">Mix</button>
                </div>
                <button id="random-btn" class="btn-random" onclick="randomMix()" title="Random Mix">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                    <span>Random</span>
                </button>
            </div>

            <div id="merge-loading" class="merge-loading hidden">
                <div class="spinner"></div>
                <span>mixing...</span>
            </div>

            <div id="merge-result" class="merge-result hidden">
                <div class="result-connector"></div>
                <div id="result-swatch" class="result-swatch">
                    <div class="result-ring"></div>
                </div>
                <h3 id="result-name" class="result-name"></h3>
                <code id="result-hex" class="result-hex"></code>
                <div id="result-parents" class="result-parents"></div>
                <span id="result-badge" class="result-badge hidden">✦ new discovery</span>
            </div>
        </section>

        <!-- Recent Mixes -->
        <section id="recent-section" class="recent-section hidden">
            <h2 class="section-title">Recent</h2>
            <div id="recent-strip" class="recent-strip"></div>
        </section>

        <!-- Palette -->
        <section class="palette-section">
            <div class="palette-header">
                <h2 class="section-title">Palette</h2>
                <input type="text" id="palette-search" class="palette-search" placeholder="search..." oninput="renderPalette()">
            </div>
            <div id="palette-grid" class="palette-grid"></div>
        </section>
    </div>

    <!-- ═══ Settings Modal ═══ -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-card settings-card">
            <h2 class="modal-title">Settings</h2>
            <div class="input-group">
                <label for="settings-api-key">API Key</label>
                <input type="password" id="settings-api-key" placeholder="sk-or-v1-...">
            </div>
            <div class="input-group">
                <label for="settings-model">Model</label>
                <select id="settings-model">
                    <option value="poolside/laguna-xs-2.1:free">Laguna XS (Free — Default)</option>
                    <option value="google/gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="google/gemini-2.5-pro">Gemini 2.5 Pro</option>
                </select>
            </div>
            <div class="input-group">
                <label for="settings-theme">Visual Theme</label>
                <select id="settings-theme">
                    <option value="underwater">🌊 Deep Ocean</option>
                    <option value="nebula">🌌 Cosmic Nebula</option>
                    <option value="cellular">🔬 Microscopic</option>
                    <option value="arcane">⚗️ Arcane Alchemist</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="closeSettings()">Cancel</button>
                <button class="btn-primary" onclick="saveSettings()">Save</button>
            </div>
            <hr class="divider">
            <button class="btn-danger" onclick="resetGame()">Reset All Progress</button>
        </div>
    </div>

    <script src="tree.js"></script>
    <script src="game.js"></script>
</body>
</html>
