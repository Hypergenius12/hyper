<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The DOM Excavator</title>
  <meta name="description" content="Dig through the geological strata of internet history.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Game Canvas (WebGL post-processing target) -->
  <canvas id="game-canvas"></canvas>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <div class="loader-icon">///</div>
      <h1 class="loader-title">THE DOM EXCAVATOR</h1>
      <p class="loader-subtitle">Initializing geological strata...</p>
      <div class="loader-bar-track">
        <div class="loader-bar-fill" id="loader-bar"></div>
      </div>
      <p class="loader-hint">Click anywhere to begin excavation</p>
    </div>
  </div>

  <!-- Biome Announcement -->
  <div id="biome-announce" class="biome-announce">
    <div class="biome-announce-depth">DEPTH: 0m</div>
    <div class="biome-announce-name">THE LANDING PAGE</div>
    <div class="biome-announce-desc">Clean, modern web blocks</div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-top">
      <div class="hud-stat">
        <span class="hud-label">DEPTH</span>
        <span class="hud-value" id="hud-depth">0m</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">BANDWIDTH</span>
        <span class="hud-value" id="hud-bandwidth">0 bits</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">BIOME</span>
        <span class="hud-value" id="hud-biome" style="color:#fff">The Landing Page</span>
      </div>
    </div>
    <div class="hud-biome-progress">
      <div class="hud-progress-track">
        <div class="hud-progress-fill" id="hud-progress"></div>
      </div>
      <span class="hud-progress-label" id="hud-progress-label">Next biome: 50m</span>
    </div>
  </div>

  <!-- Bandwidth Popup Container -->
  <div id="bandwidth-popups"></div>

  <!-- Shop Button -->
  <button id="shop-btn" title="Upgrade Shop [E]">
    <span class="shop-text">[E] UPGRADES</span>
  </button>

  <!-- Shop Overlay -->
  <div id="shop-overlay" class="hidden">
    <div id="shop-panel">
      <div class="shop-header">
        <h2>UPGRADE TERMINAL</h2>
        <div class="shop-balance">
          <span class="shop-balance-label">BANDWIDTH:</span>
          <span id="shop-balance-value">0 bits</span>
        </div>
        <div>
          <button id="reset-btn" style="background:#400; border:1px solid #f00; color:#f55; padding:5px 8px; margin-right:10px; cursor:pointer; font-size:0.7rem;">RESET</button>
          <button id="shop-close">[X]</button>
        </div>
      </div>
      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </div>

  <script type="module" src="./js/main.js?v=10"></script>
  <!-- Firebase Config & Tracker -->
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/tracker.js"></script>
</body>
</html>
