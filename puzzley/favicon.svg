  <rect x="15.5" y="45" width="10" height="2.2" rx="1" fill="#FFFFFF" stroke="#0F172A" stroke-width="0.8" />

  <!-- 4. Bottom-Right: Purple Emoji Alchemy (Magic Sparkle) -->
