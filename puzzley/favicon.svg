  <path d="M41.5 35.5 Q41.5 41.5 47.5 41.5 Q41.5 41.5 41.5 47.5 Q41.5 41.5 35.5 41.5 Q41.5 41.5 41.5 35.5 Z" fill="#FACC15" stroke="#0F172A" stroke-width="1.2" />
