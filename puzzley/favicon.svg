  <circle cx="17.5" cy="17.5" r="1.8" fill="#0F172A" />
  <circle cx="23.5" cy="17.5" r="1.8" fill="#0F172A" />
  <circle cx="17.5" cy="23.5" r="1.8" fill="#0F172A" />
  <circle cx="23.5" cy="23.5" r="1.8" fill="#0F172A" />

  <!-- 2. Top-Right: Green Wordle (Classic "W") -->
