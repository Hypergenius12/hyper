<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matrix Digital Rain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000000;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        // Matrix glyph set: Katakana, numbers, operators, Latin
        const chars = 'ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ0123456789:・."=*+-<>¦|Z';

        const fontSize = 16;
        let columns = 0;
        let drops = [];

        function initDrops() {
            canvas.width = window.innerWidth || document.documentElement.clientWidth || 800;
            canvas.height = window.innerHeight || document.documentElement.clientHeight || 600;
            columns = Math.max(1, Math.floor(canvas.width / fontSize));
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops.push({
                    y: Math.random() * -100,
                    speed: 0.8 + Math.random() * 1.6,
                    length: Math.floor(12 + Math.random() * 25),
                    chars: []
                });
            }
        }

        window.addEventListener('resize', initDrops);
        initDrops();

        let lastTime = 0;
        function draw(timestamp) {
            requestAnimationFrame(draw);

            // Semi-transparent black overlay for smooth fading trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold ' + fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const stream = drops[i];
                const x = i * fontSize;
                const headY = Math.floor(stream.y);

                // Update random character stream buffer
                if (Math.random() < 0.25 || stream.chars.length < stream.length) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    stream.chars.unshift(char);
                    if (stream.chars.length > stream.length) {
                        stream.chars.pop();
                    }
                }

                // Render stream segments
                for (let j = 0; j < stream.chars.length; j++) {
                    const charY = (headY - j) * fontSize;
                    if (charY < -fontSize || charY > canvas.height + fontSize) continue;

                    if (j === 0) {
                        // Glowing white head
                        ctx.fillStyle = '#FFFFFF';
                        ctx.shadowColor = '#80FF80';
                        ctx.shadowBlur = 10;
                        ctx.fillText(stream.chars[j], x, charY);
                        ctx.shadowBlur = 0;
                    } else if (j === 1) {
                        // Bright phosphorescent green
                        ctx.fillStyle = '#66FF66';
                        ctx.shadowColor = '#00FF41';
                        ctx.shadowBlur = 6;
                        ctx.fillText(stream.chars[j], x, charY);
                        ctx.shadowBlur = 0;
                    } else if (j < 6) {
                        // Vivid matrix green
                        ctx.fillStyle = '#00FF41';
                        ctx.fillText(stream.chars[j], x, charY);
                    } else if (j < stream.length * 0.7) {
                        // Mid matrix green
                        ctx.fillStyle = '#00AA2B';
                        ctx.fillText(stream.chars[j], x, charY);
                    } else {
                        // Dark fading tail
                        ctx.fillStyle = '#004711';
                        ctx.fillText(stream.chars[j], x, charY);
                    }
                }

                // Advance stream
                stream.y += stream.speed;

                // Reset stream after it falls past screen
                if ((stream.y - stream.length) * fontSize > canvas.height) {
                    stream.y = Math.random() * -30;
                    stream.speed = 0.8 + Math.random() * 1.6;
                    stream.length = Math.floor(12 + Math.random() * 25);
                    stream.chars = [];
                }
            }
        }

        requestAnimationFrame(draw);
    </script>
</body>
</html>
