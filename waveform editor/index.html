<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Sound Designer — Pro Studio Synth</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Google Fonts: Inter & JetBrains Mono for Hardware Displays -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=9">
    <!-- Font Awesome Pro/Free Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LameJS for MP3 export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- GarageBand / Pro Studio Header -->
        <header>
            <div class="logo">
                <i class="fa-solid fa-wave-square"></i>
                <span>NEXUS</span>
                <span class="logo-badge">PRO v8</span>
            </div>

            <!-- Central LCD Display & Transport Bar -->
            <div class="transport-container">
                <div class="global-controls">
                    <button class="btn play-btn" id="btn-play" title="Start/Pause Synthesis Engine"><i class="fa-solid fa-play"></i> Play</button>
                    <button class="btn" id="btn-stop" title="Stop & Reset Voices"><i class="fa-solid fa-stop"></i> Stop</button>
                    <button class="btn" id="btn-add-track" title="Add Layer"><i class="fa-solid fa-plus"></i> Layer</button>
                </div>

                <!-- Studio LCD Screen -->
                <div class="lcd-display">
                    <div class="lcd-item">
                        <span class="lcd-label">TEMPO</span>
                        <span class="lcd-value"><span id="lcd-bpm-val">120</span> <small style="font-size: 0.6rem; opacity: 0.7;">BPM</small></span>
                    </div>

                    <div class="lcd-item">
                        <span class="lcd-label">OCTAVE</span>
                        <span class="lcd-value" id="lcd-octave-val">C4-C5</span>
                    </div>

                    <div class="lcd-item">
                        <span class="lcd-label">VOICES</span>
                        <span class="lcd-value" id="lcd-voices-val">0</span>
                    </div>

                    <div class="lcd-item">
                        <span class="lcd-label">OUTPUT VU</span>
                        <div class="vu-meter-container">
                            <div class="vu-bar" id="vu-left">
                                <div class="vu-segment"></div><div class="vu-segment"></div><div class="vu-segment"></div>
                                <div class="vu-segment"></div><div class="vu-segment"></div><div class="vu-segment"></div>
                            </div>
                            <div class="vu-bar" id="vu-right">
                                <div class="vu-segment"></div><div class="vu-segment"></div><div class="vu-segment"></div>
                                <div class="vu-segment"></div><div class="vu-segment"></div><div class="vu-segment"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="global-controls">
                    <button class="btn" id="btn-save-preset" title="Save Preset to Memory"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                    <button class="btn" id="btn-load-preset" title="Load Preset"><i class="fa-solid fa-folder-open"></i> Preset</button>
                    <button class="btn" id="btn-import" title="Import Audio Sample"><i class="fa-solid fa-file-audio"></i> Sample</button>
                    <input type="file" id="import-file" accept="audio/*" style="display: none;">
                </div>
            </div>

            <!-- Export & Utility Controls -->
            <div class="export-controls">
                <label style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: var(--text-secondary); cursor: pointer;" title="Customize Synth Accent Glow">
                    <input type="color" id="theme-color-picker" value="#ff6b00" style="border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; padding: 0; background: transparent;">
                </label>
                <button class="btn small" id="btn-reset-global" title="Reset Theme & Settings" style="color: var(--danger);"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn small" id="btn-tutorial" title="Interactive Tutorial"><i class="fa-solid fa-circle-question"></i> Help</button>
                <button class="btn small" id="btn-export-wav" title="Export Lossless 16-bit WAV"><i class="fa-solid fa-download"></i> WAV</button>
                <button class="btn small primary" id="btn-export-mp3" title="Export 128kbps MP3"><i class="fa-solid fa-bolt"></i> MP3</button>
            </div>
        </header>

        <!-- Main 3-Column Studio Workspace -->
        <main class="workspace">
            <!-- Left Panel: Layers / Tracks (DAW Strip) -->
            <section class="tracks-panel glass-panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-layer-group"></i> Sound Layers</h2>
                    <button id="btn-add-track-side" class="btn small" title="Add Layer"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="tracks-container" class="tracks-list">
                    <!-- Tracks injected dynamically via JS -->
                </div>
            </section>

            <!-- Center Panel: CRT Visualizer, Modular Hardware Rack, and Piano Keyboard -->
            <section class="center-panel">
                <!-- Master Cathode Ray Tube / OLED Oscilloscope -->
                <div class="visualizer-container glass-panel">
                    <div style="position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; gap: 0.4rem;">
                        <button id="btn-visualizer-settings" class="btn small" title="Oscilloscope Settings"><i class="fa-solid fa-sliders"></i></button>
                        <button id="btn-toggle-visualizer" class="btn small" title="Switch between Waveform, FFT Spectrum, and Circular Polar"><i class="fa-solid fa-chart-simple"></i> Mode</button>
                    </div>
                    
                    <!-- Visualizer Settings Popover -->
                    <div id="visualizer-settings-panel" class="glass-panel" style="display: none; position: absolute; top: 40px; right: 8px; z-index: 20; padding: 1rem; flex-direction: column; gap: 0.8rem; min-width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,0.8);">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem;">
                            <h4 style="margin: 0; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Scope Settings</h4>
                            <button id="btn-close-vis-settings" style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1rem;"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        
                        <label style="font-size: 0.75rem; display: flex; flex-direction: column; gap: 0.3rem;">
                            <div style="display: flex; justify-content: space-between;"><span>Phosphor Persistence</span><span id="vis-blur-val" style="color: var(--accent);">0%</span></div>
                            <input type="range" id="vis-blur" min="0" max="95" value="0">
                        </label>
                        
                        <label style="font-size: 0.75rem; display: flex; flex-direction: column; gap: 0.3rem;">
                            <div style="display: flex; justify-content: space-between;"><span>FFT Smoothing</span><span id="vis-smooth-val" style="color: var(--accent);">80%</span></div>
                            <input type="range" id="vis-smooth" min="0" max="99" value="80">
                        </label>
                        
                        <label style="font-size: 0.75rem; display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="vis-freeze" style="accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer;"> 
                            <span>Freeze Waveform (Zero-Crossing)</span>
                        </label>
                        
                        <label style="font-size: 0.75rem; display: flex; flex-direction: column; gap: 0.3rem;">
                            <span>Color Palette</span>
                            <select id="vis-color-mode">
                                <option value="accent">Studio Accent</option>
                                <option value="rainbow">Chromatic Rainbow</option>
                            </select>
                        </label>
                    </div>
                    
                    <canvas id="master-visualizer"></canvas>
                </div>

                <!-- Hardware Modular Synthesizer Rack -->
                <div class="editor-container glass-panel" id="editor-container">
                    <div class="empty-state" id="editor-empty-state">
                        <i class="fa-solid fa-sliders"></i>
                        <p style="font-weight: 600; font-size: 1rem;">Select or add a sound layer to open the synth rack</p>
                    </div>
                    <!-- Modular hardware racks injected dynamically via JS -->
                </div>

                <!-- Interactive Piano Keyboard Dock (GarageBand Style) -->
                <div class="piano-keyboard-dock glass-panel">
                    <div class="piano-dock-header">
                        <div class="piano-controls">
                            <span style="font-size: 0.75rem; font-weight: 800; color: var(--text-secondary); letter-spacing: 0.5px;"><i class="fa-solid fa-keyboard"></i> KEYBED</span>
                            <button class="btn small" id="btn-oct-down" title="Shift Down Octave"><i class="fa-solid fa-chevron-left"></i> Oct -</button>
                            <button class="btn small" id="btn-oct-up" title="Shift Up Octave">Oct + <i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                        <div class="piano-controls">
                            <label style="font-size: 0.75rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                                <input type="checkbox" id="arp-toggle" style="accent-color: var(--accent);"> 
                                <span>Arp (16th)</span>
                            </label>
                            <label style="font-size: 0.75rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.4rem;">
                                BPM:
                                <input type="range" id="arp-bpm" min="60" max="240" value="120" style="width: 70px;">
                                <span id="arp-bpm-val" style="font-family: monospace; color: var(--accent); min-width: 25px;">120</span>
                            </label>
                            <button class="btn small" id="btn-toggle-sequencer" title="Toggle 16-Step Matrix Sequencer"><i class="fa-solid fa-table-cells"></i> Sequencer</button>
                        </div>
                    </div>

                    <!-- Visual Piano Keybed -->
                    <div class="piano-keybed" id="piano-keybed">
                        <!-- Keys dynamically populated in JS -->
                    </div>
                </div>

                <!-- Collapsible 16-Step Matrix Sequencer -->
                <div id="sequencer-panel-container" style="display: none;">
                    <div class="sequencer-panel glass-panel">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <h4 style="margin: 0; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: var(--text-secondary); display: flex; align-items: center; gap: 0.5rem;"><i class="fa-solid fa-table-cells"></i> 16-Step Polyphonic Sequencer</h4>
                            <div style="display: flex; gap: 0.4rem;">
                                <button class="btn small" id="btn-seq-play" title="Play/Stop Sequence"><i class="fa-solid fa-play"></i> Run</button>
                                <button class="btn small" id="btn-seq-clear" title="Clear All Steps"><i class="fa-solid fa-trash"></i> Clear</button>
                            </div>
                        </div>
                        <div id="sequencer-grid" class="seq-grid-wrapper">
                            <!-- Generated dynamically via JS -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Panel: Wave Editor Lab -->
            <section class="tools-panel glass-panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-pen-ruler"></i> Wave Lab</h2>
                </div>
                <div class="drawer-container">
                    <canvas id="drawer-canvas" width="300" height="200"></canvas>
                    <div class="drawer-controls">
                        <button id="btn-drawer-apply" class="btn small primary" title="Compile waveform to custom synth oscillator"><i class="fa-solid fa-check"></i> Apply</button>
                        <button id="btn-drawer-clear" class="btn small" title="Clear canvas"><i class="fa-solid fa-eraser"></i> Clear</button>
                        <button id="btn-drawer-smooth" class="btn small" title="Smooth sharp transients"><i class="fa-solid fa-bezier-curve"></i> Smooth</button>
                        <button id="btn-drawer-invert" class="btn small" title="Invert phase 180°"><i class="fa-solid fa-arrows-up-down"></i> Invert</button>
                        <button id="btn-drawer-noise" class="btn small" title="Add harmonic noise"><i class="fa-solid fa-shuffle"></i> Noise</button>
                        <button id="btn-drawer-normalize" class="btn small" title="Normalize peaks to 100%"><i class="fa-solid fa-up-right-and-down-left-from-center"></i> Norm</button>
                        <select id="drawer-harmonics" title="DFT Fourier Harmonic Depth">
                            <option value="16">16 Harmonics (Lo-Fi)</option>
                            <option value="32">32 Harmonics</option>
                            <option value="64" selected>64 Harmonics (Standard)</option>
                            <option value="128">128 Harmonics</option>
                            <option value="256">256 Harmonics (Hi-Fi)</option>
                        </select>
                    </div>
                    <div class="preset-waves">
                        <button class="btn icon-btn" data-wave="sine" title="Sine Wave"><i class="fa-solid fa-wave-square"></i></button>
                        <button class="btn icon-btn" data-wave="square" title="Square Wave"><i class="fa-solid fa-square"></i></button>
                        <button class="btn icon-btn" data-wave="sawtooth" title="Sawtooth Wave"><i class="fa-solid fa-caret-up"></i></button>
                        <button class="btn icon-btn" data-wave="triangle" title="Triangle Wave"><i class="fa-solid fa-play fa-rotate-270"></i></button>
                        <button id="btn-drawer-mic" class="btn icon-btn" style="color: var(--danger);" title="Record Voice into Synth Waveform"><i class="fa-solid fa-microphone"></i></button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals & Overlays -->
    <div id="loading-overlay" class="overlay hidden">
        <div class="spinner"></div>
        <p id="loading-text" style="font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;">Exporting Studio Mix...</p>
    </div>

    <!-- Scripts -->
    <script src="js/audio-engine.js?v=9"></script>
    <script src="js/visualizer.js?v=9"></script>
    <script src="js/track.js?v=9"></script>
    <script src="js/wave-drawer.js?v=9"></script>
    <script src="js/export.js?v=9"></script>
    <script src="js/tutorial.js?v=9"></script>
    <script src="js/app.js?v=9"></script>

    <!-- Firebase Config & Playtime Tracker -->
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/tracker.js"></script>
</body>
</html>
